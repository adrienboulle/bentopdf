services:
  bentopdf:
    # GitHub Container Registry (Recommended)
    # Self-Hosted build - ghcr.io/alam00000/bentopdf-simple:latest
    # Commercial build  - ghcr.io/alam00000/bentopdf:latest
    # Docker Hub (Alternative)
    # Self-Hosted build - bentopdfteam/bentopdf-simple:latest
    # Commercial build  - bentopdfteam/bentopdf:latest
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
# Destinations without a rebuild (docs/destinations.md): origins allowed by the CSP, and a preset for all users
#  - DESTINATION_HOSTS=https://documents.example.com
#  - DESTINATIONS_DEFAULT=[{"name":"Documents","url":"https://documents.example.com/api/upload","method":"POST","mode":"both"}]
